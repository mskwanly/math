<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>關老師的數學教學工具箱｜傳送門</title>
<meta name="description" content="關麗瑩老師製作的互動教學小工具集合：四邊形特性、平行四邊形、三角形及梯形面積公式探索等。">
<!-- QR code 產生器（約 20KB，離線亦可用） -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--c1:#2b6cb0;--bg:#f2f6fb;--card:#fff;--txt:#222;--muted:#5a6a7a}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
header{background:linear-gradient(120deg,#2b6cb0,#4299e1 60%,#63b3ed);color:#fff;padding:28px 22px 30px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
header h1{margin:0;font-size:30px;letter-spacing:1px}
header p{margin:6px 0 0;font-size:16px;opacity:.95}
.credit{position:absolute;right:22px;top:16px;font-size:15px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;z-index:1}
@media(max-width:700px){.credit{position:static;display:inline-block;margin-top:10px}}
main{max-width:1100px;margin:22px auto 30px;padding:0 16px}
.toolbar{background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input{flex:1 1 220px;font-size:17px;padding:9px 14px;border:2px solid #cbd5e0;border-radius:10px}
.toolbar input:focus{outline:none;border-color:var(--c1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid #cbd5e0;background:#fff;border-radius:999px;padding:5px 14px;font-size:15px;cursor:pointer}
.chip.active{background:var(--c1);color:#fff;border-color:var(--c1)}
.count{font-size:15px;color:var(--muted);margin:14px 4px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s;border-top:6px solid var(--accent,#2b6cb0)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}

/* ---- 預覽區 ---- */
.preview{position:relative;aspect-ratio:16/9;background:#e2e8f0;overflow:hidden;cursor:zoom-in}
.preview video,.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview .live{position:absolute;inset:0;overflow:hidden;background:#fff}
.preview .live iframe{position:absolute;left:0;top:0;width:1200px;height:675px;border:0;transform-origin:0 0;pointer-events:none}
.preview .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;background:color-mix(in srgb,var(--accent) 12%,#fff)}
.preview .lbl{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:6px;pointer-events:none}
.preview .zoom{position:absolute;right:8px;bottom:8px;font-size:13px;background:rgba(0,0,0,.55);color:#fff;padding:3px 9px;border-radius:6px;pointer-events:none;opacity:0;transition:.2s}
.preview:hover .zoom{opacity:1}
.preview .yt{position:absolute;inset:0;display:grid;place-items:center}
.preview .yt span{width:64px;height:44px;background:rgba(229,62,62,.92);border-radius:12px;display:grid;place-items:center;color:#fff;font-size:24px}
.preview .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;background:#edf2f7}

/* ---- 標題區（標題及圖示可按） ---- */
.top{display:flex;gap:12px;align-items:center}
.icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--accent) 15%,#fff);flex:none;text-decoration:none;transition:.15s}
.icon:hover{transform:scale(1.08);box-shadow:0 0 0 2px var(--accent)}
.card h2{margin:0;font-size:20px}
.card h2 a{color:inherit;text-decoration:none;transition:.15s}
.card h2 a:hover{color:var(--accent);text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:13px;background:#edf2f7;color:#2a4365;border-radius:6px;padding:2px 8px}
.desc{font-size:15.5px;color:#333;margin:0;flex:1}

/* ---- 底部：按鈕 + QR ---- */
.foot{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{text-decoration:none;border:0;cursor:pointer;border-radius:10px;padding:8px 14px;font-size:15px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:4px}
.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:6px 10px;font-size:14px}
.qr{flex:none;text-align:center;cursor:zoom-in;font-size:12px;color:var(--muted);line-height:1.3}
.qr svg,.qr img{width:78px;height:78px;display:block;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px;margin:0 auto 3px;transition:.15s}
.qr:hover svg,.qr:hover img{box-shadow:0 0 0 2px var(--accent)}

.empty{text-align:center;color:var(--muted);padding:40px;font-size:18px}
.new::after{content:"NEW";font-size:11px;background:#e53e3e;color:#fff;border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
footer{text-align:center;color:var(--muted);font-size:14px;padding:20px}
footer a{color:var(--c1)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2a4365;color:#fff;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;font-size:15px;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---- 放大視窗 ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:16px;width:min(1100px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #e2e8f0}
.modal .mh h3{margin:0;flex:1;font-size:18px}
.modal .mh .x{border:0;background:#edf2f7;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.modal .mb{position:relative;aspect-ratio:16/9;background:#000;max-height:calc(94vh - 60px)}
.modal .mb iframe,.modal .mb video,.modal .mb img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#fff}
/* QR 放大版 */
.modal .mb.qrbig{aspect-ratio:auto;background:#fff;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:auto}
.modal .mb.qrbig svg,.modal .mb.qrbig img{position:static;width:min(360px,70vw);height:auto;border:1px solid #e2e8f0;border-radius:12px;padding:12px}
.modal .mb.qrbig .url{font-size:14px;color:var(--muted);word-break:break-all;text-align:center;max-width:600px}
.modal .mb.qrbig .warn{font-size:14px;color:#c05621;background:#fffaf0;border:1px solid #fbd38d;border-radius:8px;padding:8px 12px;max-width:600px;text-align:center}
.modal .mb.qrbig .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<header>
 <h1>🧰 關老師的數學教學工具箱</h1>
 <p>互動教學小工具傳送門｜按卡片即可開啟，適合課堂使用及家中進行自主學習</p>
 <div class="credit">網頁製作：關麗瑩老師</div>
</header>

<main>
 <div class="toolbar">
  <input id="q" type="search" placeholder="🔍 搜尋工具名稱、單元或關鍵字……">
  <div class="chips" id="chips"></div>
 </div>
 <div class="count" id="count"></div>
 <div class="grid" id="grid"></div>
</main>

<footer>
 © <span id="yr"></span> 關麗瑩老師 ｜ 工具均以 HTML 製作，無需安裝，建議使用 Chrome / Edge / Safari 開啟。
 ｜ <a href="https://github.com/mskwanly/math" target="_blank" rel="noopener">GitHub 倉庫</a>  <!-- ★ 已改為新 repo，如名稱唔同請改返 -->
</footer>

<div class="modal" id="modal"><div class="box"><div class="mh"><h3 id="mTitle"></h3><a class="btn small" id="mOpen" target="_blank" rel="noopener">↗ 開啟工具</a><button class="x" id="mClose" aria-label="關閉">✕</button></div><div class="mb" id="mBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ★ 版本號：每次更新「任何」工具 html 後，改一改這個日期並一同上載，
     所有人（包括你自己）打開傳送門都會自動載入最新版本，唔會再被快取卡住。
   ============================================================ */
const VER='2026-11-12';

/* ============================================================
   ★ 新增工具只需在這裏加一個項目 ★（QR code 會自動產生，毋須設定）
   url 一律用相對路徑（同 index.html 同一資料夾就直接寫檔名）
   preview 四選一：
     {type:'live'}                                   即時縮圖（直接嵌入工具網頁，不用錄影）
     {type:'video', src:'previews/xxx.mp4', poster:'previews/xxx.jpg'}   自己錄的短片（poster 可省略）
     {type:'gif',   src:'previews/xxx.gif'}          GIF 動圖
     {type:'youtube', id:'YouTube影片編號'}            YouTube 影片
   省略 preview 則只顯示 Emoji 圖示。
   ============================================================ */
const TOOLS=[
 {icon:'🔷',title:'認識四邊形的特性',url:'quadrilateral.html',topic:'圖形與空間',
  tags:['正方形','長方形','平行四邊形','梯形','菱形','鷂形','釘板','七巧板','方格紙','窗櫺','風箏'],
  desc:'認識六種常見四邊形的特性；分辨正方形、長方形及菱形的異同；用方格紙、釘板、七巧板製作四邊形；認識中國傳統窗櫺及風箏非遺文化。',
  color:'#2b6cb0',
  preview:{type:'live'}},
 {icon:'✂️',title:'探索平行四邊形面積公式',url:'parallelogram_cut_tool.html',topic:'度量',
  tags:['平行四邊形','面積','剪拼','長方形','底','高','公式'],
  desc:'把平行四邊形沿高剪開，拼成長方形，探究平行四邊形面積公式（底 × 高）的由來。',
  color:'#dd6b20',
  preview:{type:'live'}},
 {icon:'🔺',title:'探索三角形面積公式',url:'triangle_area_explore.html',topic:'度量',
  tags:['三角形','面積','平行四邊形','長方形','底','高','公式','剪拼'],
  desc:'把兩個全等三角形拼成平行四邊形，或把三角形剪拼成長方形，探究三角形面積公式（底 × 高 ÷ 2）的由來。',
  color:'#38a169',isNew:true,
  preview:{type:'live'}},
 {icon:'⏢',title:'探索梯形面積公式',url:'trapezoid_area_explore.html',topic:'度量',
  tags:['梯形','面積','上底','下底','高','平行四邊形','三角形','公式','剪拼'],
  desc:'把兩個全等梯形拼成平行四邊形，或把梯形分割成三角形及平行四邊形，探究梯形面積公式（（上底 ＋ 下底）× 高 ÷ 2）的由來。',
  color:'#805ad5',isNew:true,
  preview:{type:'live'}},
];

/* ---------------- 以下毋須修改 ---------------- */
const grid=document.getElementById('grid'),chips=document.getElementById('chips'),q=document.getElementById('q'),count=document.getElementById('count'),toast=document.getElementById('toast');
const modal=document.getElementById('modal'),mBody=document.getElementById('mBody'),mTitle=document.getElementById('mTitle'),mOpen=document.getElementById('mOpen');
document.getElementById('yr').textContent=new Date().getFullYear();
let topic='全部';
const topics=['全部',...new Set(TOOLS.map(t=>t.topic))];
topics.forEach(t=>{const b=document.createElement('button');b.className='chip'+(t===topic?' active':'');b.textContent=t;b.onclick=()=>{topic=t;chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===b));render();};chips.append(b);});

const abs=url=>new URL(url,location.href).href;                        // 完整乾淨網址（QR / 複製連結用）
const vurl=url=>url+(url.includes('?')?'&':'?')+'v='+VER;              // ★ 帶版本號網址（預覽 / 開啟用，避開快取）
const isLocal=location.protocol==='file:';
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}
function copy(url){(navigator.clipboard?navigator.clipboard.writeText(abs(url)):Promise.reject()).then(()=>showToast('已複製連結 ✅'),()=>prompt('請複製以下連結：',abs(url)));}

/* ---- QR code ---- */
function makeQR(url,opt={}){
 if(typeof qrcode==='undefined'){ // CDN 載入失敗時改用線上 API
  return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=${encodeURIComponent(url)}" alt="QR code">`;
 }
 const qr=qrcode(0,'M');qr.addData(url);qr.make();
 return qr.createSvgTag({cellSize:opt.cellSize||4,margin:opt.margin??0,scalable:opt.scalable??true});
}
function downloadQR(t){
 const url=abs(t.url),name=t.title.replace(/[\\/:*?"<>|]/g,'')+'_QR.png';
 if(typeof qrcode==='undefined'){window.open(`https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=16&data=${encodeURIComponent(url)}`,'_blank');return;}
 const svg=makeQR(url,{cellSize:8,margin:4,scalable:false});
 const blob=new Blob([svg],{type:'image/svg+xml'}),u=URL.createObjectURL(blob),img=new Image();
 img.onload=()=>{
  const S=800,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,S,S);x.drawImage(img,0,0,S,S);
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=name;a.click();URL.revokeObjectURL(u);showToast('已下載 QR code ✅');
 };
 img.src=u;
}
function openQR(t){
 const url=abs(t.url);
 mTitle.textContent='📱 掃碼開啟：'+t.title;mOpen.href=vurl(t.url);   // ★
 mBody.className='mb qrbig';
 mBody.innerHTML=`${makeQR(url,{cellSize:10,margin:0})}
  <div class="url">${url}</div>
  ${isLocal?'<div class="warn">⚠️ 你現在是在本機開啟此檔案，QR 指向本機路徑，他人無法掃描。上載到 GitHub Pages 後再開啟本頁，QR 便會自動變成正確網址。</div>':''}
  <div class="acts"><button class="btn" id="qrDl">⬇ 下載 PNG</button><button class="btn ghost" id="qrCp">🔗 複製連結</button></div>`;
 modal.classList.add('open');document.body.style.overflow='hidden';
 document.getElementById('qrDl').onclick=()=>downloadQR(t);
 document.getElementById('qrCp').onclick=()=>copy(t.url);
}

/* 進入畫面才載入／播放，離開畫面即暫停，節省流量 */
const io=new IntersectionObserver(es=>es.forEach(e=>{
 const el=e.target;
 if(el.tagName==='VIDEO'){e.isIntersecting?el.play().catch(()=>{}):el.pause();}
 else if(el.classList.contains('live')&&e.isIntersecting&&!el.dataset.loaded){el.dataset.loaded=1;const f=document.createElement('iframe');f.src=el.dataset.src;f.loading='lazy';f.title='預覽';f.onload=()=>el.querySelector('.loading')?.remove();el.append(f);fitLive(el);}
}),{threshold:.3});

function fitLive(el){const f=el.querySelector('iframe');if(f)f.style.transform=`scale(${el.clientWidth/1200})`;}
window.addEventListener('resize',()=>document.querySelectorAll('.preview .live').forEach(fitLive));

function previewHTML(t){
 const p=t.preview,ph=`<div class="ph">${t.icon}</div>`;
 if(!p)return ph;
 switch(p.type){
  case 'live':return `<div class="live" data-src="${vurl(t.url)}"><div class="loading">⏳ 載入預覽中…</div></div><span class="lbl">即時預覽</span>`;   // ★
  case 'video':return `<video muted loop playsinline preload="metadata" ${p.poster?`poster="${p.poster}"`:''} src="${p.src}"></video><span class="lbl">▶ 影片預覽</span>`;
  case 'gif':return `<img src="${p.src}" loading="lazy" alt="${t.title} 預覽"><span class="lbl">預覽</span>`;
  case 'youtube':return `<img src="https://img.youtube.com/vi/${p.id}/hqdefault.jpg" loading="lazy" alt="${t.title} 影片"><div class="yt"><span>▶</span></div><span class="lbl">YouTube</span>`;
  default:return ph;
 }
}
function bigHTML(t){
 const p=t.preview;
 if(!p)return '';
 switch(p.type){
  case 'live':return `<iframe src="${vurl(t.url)}" title="${t.title}"></iframe>`;   // ★
  case 'video':return `<video src="${p.src}" controls autoplay muted loop playsinline></video>`;
  case 'gif':return `<img src="${p.src}" alt="">`;
  case 'youtube':return `<iframe src="https://www.youtube.com/embed/${p.id}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${t.title}"></iframe>`;
 }
}
function openModal(t){mTitle.textContent=t.title;mOpen.href=vurl(t.url);mBody.className='mb';mBody.innerHTML=bigHTML(t);modal.classList.add('open');document.body.style.overflow='hidden';}   // ★
function closeModal(){modal.classList.remove('open');mBody.innerHTML='';mBody.className='mb';document.body.style.overflow='';}
document.getElementById('mClose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function render(){
 const kw=q.value.trim().toLowerCase();
 const list=TOOLS.filter(t=>(topic==='全部'||t.topic===topic)&&(!kw||[t.title,t.topic,t.desc,...t.tags].join(' ').toLowerCase().includes(kw)));
 count.textContent=`共 ${list.length} 個工具`;
 grid.innerHTML=list.length?'':'<div class="empty">找不到相關工具，試試其他關鍵字。</div>';
 list.forEach(t=>{
  const c=document.createElement('article');c.className='card';c.style.setProperty('--accent',t.color||'#2b6cb0');
  const link=vurl(t.url);   // ★ 帶版本號的開啟連結
  c.innerHTML=`<div class="preview" title="按一下放大預覽">${previewHTML(t)}<span class="zoom">🔍 放大預覽</span></div>
   <div class="body">
    <div class="top">
     <a class="icon" href="${link}" title="開啟 ${t.title}">${t.icon}</a>
     <div>
      <h2 class="${t.isNew?'new':''}"><a href="${link}" title="開啟 ${t.title}">${t.title}</a></h2>
      <div class="tags"><span class="tag">${t.topic}</span></div>
     </div>
    </div>
    <p class="desc">${t.desc}</p>
    <div class="tags">${t.tags.map(x=>`<span class="tag">#${x}</span>`).join('')}</div>
    <div class="foot">
     <div class="btns"><a class="btn" href="${link}">▶ 開啟</a><a class="btn ghost" href="${link}" target="_blank" rel="noopener">↗ 新視窗</a><button class="btn ghost small" data-url="${t.url}">🔗 複製連結</button></div>
     <div class="qr" title="按一下放大 QR code">${makeQR(abs(t.url))}掃碼開啟</div>
    </div>
   </div>`;
  c.querySelector('.btns button').onclick=e=>copy(e.currentTarget.dataset.url);
  c.querySelector('.qr').onclick=()=>openQR(t);
  const pv=c.querySelector('.preview');
  pv.onclick=()=>t.preview?openModal(t):location.assign(link);   // ★
  const v=pv.querySelector('video');
  if(v){v.onerror=()=>{pv.innerHTML=`<div class="ph">${t.icon}</div><span class="lbl">找不到影片檔</span>`;};pv.onmouseenter=()=>v.play().catch(()=>{});io.observe(v);}
  const lv=pv.querySelector('.live');if(lv)io.observe(lv);
  grid.append(c);
 });
}
q.addEventListener('input',render);
render();
</script>
</body>
</html>
